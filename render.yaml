services:
  - type: web
    name: smart-attendance-online
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
